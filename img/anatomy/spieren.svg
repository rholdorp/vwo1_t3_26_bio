<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 1100" class="anat-svg" aria-label="Spieren — boekplaatje vooraanzicht (links) en achteraanzicht (rechts)" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .region { cursor: pointer; }
      .hit    { fill: rgba(0,0,0,0); stroke: none; pointer-events: all; }
      .region:hover .hit          { fill: rgba(253, 224, 71, 0.32); stroke: #ca8a04; stroke-width: 1.5; }
      .region.correct .hit        { fill: rgba(34, 197, 94, 0.45); stroke: #16a34a; stroke-width: 2; }
      .region.wrong   .hit        { fill: rgba(220, 38, 38, 0.45); stroke: #dc2626; stroke-width: 2; }
      .region.hint    .hit        { fill: rgba(59, 130, 246, 0.5);  stroke: #2563eb; stroke-width: 2; }
      .mask   { fill: #ffffff; pointer-events: none; }
      .legend { font: 600 11px sans-serif; fill: #0f172a; pointer-events: none; }
    </style>
  </defs>

  <!-- Boekplaatje van de spieren (vooraanzicht links, achteraanzicht rechts) -->
  <image href="img/anatomy/book-spieren.jpg" x="0" y="0" width="460" height="1100" preserveAspectRatio="xMidYMid slice"/>

  <!-- Witte maskers om eventuele tekstlabels langs de randen weg te vegen -->
  <rect class="mask" x="0"   y="0"   width="460" height="32"/>
  <rect class="mask" x="0"   y="1062" width="460" height="38"/>
  <rect class="mask" x="0"   y="0"   width="14"  height="1100"/>
  <rect class="mask" x="446" y="0"   width="14"  height="1100"/>

  <text class="legend" x="115" y="22">vooraanzicht</text>
  <text class="legend" x="345" y="22">achteraanzicht</text>

  <!-- ================ VOORAANZICHT (links) ================ -->

  <!-- Borstspier (twee 'helften' over het bovenste deel van de borst) -->
  <g class="region" data-region="m-borstspier">
    <title>borstspier</title>
    <rect class="hit" x="46" y="200" width="78" height="80" rx="14"/>
    <rect class="hit" x="132" y="200" width="78" height="80" rx="14"/>
  </g>

  <!-- Tussenribspieren (smalle band onder de borstspier, op de ribben) -->
  <g class="region" data-region="m-tussenribspieren">
    <title>tussenribspieren</title>
    <rect class="hit" x="42"  y="280" width="84" height="56" rx="6"/>
    <rect class="hit" x="130" y="280" width="84" height="56" rx="6"/>
  </g>

  <!-- Buikspieren (centraal, onder borst) -->
  <g class="region" data-region="m-buikspieren">
    <title>buikspieren</title>
    <rect class="hit" x="90" y="336" width="86" height="110" rx="10"/>
  </g>

  <!-- Biceps (voorzijde bovenarm, links en rechts) -->
  <g class="region" data-region="m-biceps">
    <title>biceps</title>
    <rect class="hit" x="10"  y="210" width="38" height="100" rx="14"/>
    <rect class="hit" x="218" y="210" width="38" height="100" rx="14"/>
  </g>

  <!-- Voorste dijbeenspier (quadriceps, bovenbeen voorzijde) -->
  <g class="region" data-region="m-dijbeenspier">
    <title>voorste dijbeenspier (quadriceps)</title>
    <rect class="hit" x="68"  y="540" width="48" height="170" rx="16"/>
    <rect class="hit" x="148" y="540" width="48" height="170" rx="16"/>
  </g>

  <!-- Scheenbeenspier (onderbeen, voorzijde) -->
  <g class="region" data-region="m-scheenbeenspier">
    <title>scheenbeenspier</title>
    <rect class="hit" x="80"  y="760" width="32" height="130" rx="8"/>
    <rect class="hit" x="152" y="760" width="32" height="130" rx="8"/>
  </g>

  <!-- ================ ACHTERAANZICHT (rechts, offset +240px) ================ -->

  <!-- Monnikskapspier (trapezius, bovenrug + nek — ruitvorm) -->
  <g class="region" data-region="m-monnikskap">
    <title>monnikskapspier</title>
    <rect class="hit" x="282" y="160" width="148" height="120" rx="14"/>
  </g>

  <!-- Rugspieren (onderrug, latissimus — onder de monnikskap) -->
  <g class="region" data-region="m-rugspieren">
    <title>rugspieren</title>
    <rect class="hit" x="288" y="280" width="142" height="120" rx="14"/>
  </g>

  <!-- Triceps (achterkant bovenarm) -->
  <g class="region" data-region="m-triceps">
    <title>triceps</title>
    <rect class="hit" x="246" y="220" width="36" height="120" rx="12"/>
    <rect class="hit" x="430" y="220" width="26" height="120" rx="12"/>
  </g>

  <!-- Bilspier -->
  <g class="region" data-region="m-bilspier">
    <title>bilspier</title>
    <rect class="hit" x="280" y="406" width="148" height="92" rx="20"/>
  </g>

  <!-- Achterste dijbeenspier (hamstring) -->
  <g class="region" data-region="m-achterste-dijbeenspier">
    <title>achterste dijbeenspier (hamstring)</title>
    <rect class="hit" x="288" y="510" width="56" height="180" rx="16"/>
    <rect class="hit" x="372" y="510" width="56" height="180" rx="16"/>
  </g>

  <!-- Kuitspier (achterkant onderbeen) -->
  <g class="region" data-region="m-kuitspier">
    <title>kuitspier</title>
    <rect class="hit" x="288" y="720" width="56" height="160" rx="14"/>
    <rect class="hit" x="372" y="720" width="56" height="160" rx="14"/>
  </g>

  <!-- Achillespees (van kuitspier naar hiel) -->
  <g class="region" data-region="m-achillespees">
    <title>achillespees</title>
    <rect class="hit" x="296" y="880" width="42" height="80" rx="10"/>
    <rect class="hit" x="378" y="880" width="42" height="80" rx="10"/>
  </g>

</svg>
