<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 1100" class="anat-svg" aria-label="Skelet — boekplaatje vooraanzicht (links) en achteraanzicht (rechts)" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .region { cursor: pointer; }
      .hit    { fill: rgba(0,0,0,0); stroke: none; pointer-events: all; }
      .region:hover .hit          { fill: rgba(253, 224, 71, 0.32); stroke: #ca8a04; stroke-width: 1.5; }
      .region.correct .hit        { fill: rgba(34, 197, 94, 0.45); stroke: #16a34a; stroke-width: 2; }
      .region.wrong   .hit        { fill: rgba(220, 38, 38, 0.45); stroke: #dc2626; stroke-width: 2; }
      .region.hint    .hit        { fill: rgba(59, 130, 246, 0.5);  stroke: #2563eb; stroke-width: 2; }
      .mask   { fill: #ffffff; pointer-events: none; }
      .legend { font: 600 11px sans-serif; fill: #0f172a; pointer-events: none; }
    </style>
  </defs>

  <!-- Boekplaatje van het skelet (vooraanzicht links, achteraanzicht rechts) -->
  <image href="img/anatomy/book-skelet.jpg" x="0" y="0" width="460" height="1100" preserveAspectRatio="xMidYMid slice"/>

  <!-- Witte maskers om eventuele tekstlabels langs de randen weg te vegen -->
  <rect class="mask" x="0"   y="0"   width="460" height="32"/>
  <rect class="mask" x="0"   y="1062" width="460" height="38"/>
  <rect class="mask" x="0"   y="0"   width="14"  height="1100"/>
  <rect class="mask" x="446" y="0"   width="14"  height="1100"/>

  <text class="legend" x="115" y="22">vooraanzicht</text>
  <text class="legend" x="345" y="22">achteraanzicht</text>

  <!-- ================ VOORAANZICHT (links) ================ -->

  <!-- Schedel -->
  <g class="region" data-region="r-schedel">
    <title>schedel</title>
    <rect class="hit" x="80" y="40"  width="90" height="110" rx="40"/>
  </g>

  <!-- Onderkaak -->
  <g class="region" data-region="r-onderkaak">
    <title>onderkaak</title>
    <rect class="hit" x="92" y="150" width="66" height="26" rx="6"/>
  </g>

  <!-- Halswervels -->
  <g class="region" data-region="r-halswervels">
    <title>halswervels</title>
    <rect class="hit" x="108" y="178" width="38" height="22" rx="3"/>
  </g>

  <!-- Sleutelbeen -->
  <g class="region" data-region="r-sleutelbeen">
    <title>sleutelbeen</title>
    <rect class="hit" x="50" y="200" width="148" height="20" rx="4"/>
  </g>

  <!-- Borstbeen (midden) -->
  <g class="region" data-region="r-borstbeen">
    <title>borstbeen</title>
    <rect class="hit" x="112" y="220" width="32" height="120" rx="5"/>
  </g>

  <!-- Ribben (twee blokken naast het borstbeen) -->
  <g class="region" data-region="r-ribben">
    <title>ribben</title>
    <rect class="hit" x="44"  y="220" width="66" height="180" rx="10"/>
    <rect class="hit" x="146" y="220" width="66" height="180" rx="10"/>
  </g>

  <!-- Opperarmbeen (bovenarm, links én rechts) -->
  <g class="region" data-region="r-opperarmbeen">
    <title>opperarmbeen</title>
    <rect class="hit" x="14"  y="220" width="32" height="170" rx="10"/>
    <rect class="hit" x="216" y="220" width="32" height="170" rx="10"/>
  </g>

  <!-- Spaakbeen (lateraal — buitenkant van de onderarm) -->
  <g class="region" data-region="r-spaakbeen">
    <title>spaakbeen</title>
    <rect class="hit" x="6"   y="390" width="22" height="130" rx="5"/>
    <rect class="hit" x="232" y="390" width="22" height="130" rx="5"/>
  </g>

  <!-- Ellepijp (mediaal — binnenkant van de onderarm) -->
  <g class="region" data-region="r-ellepijp">
    <title>ellepijp</title>
    <rect class="hit" x="30"  y="390" width="22" height="130" rx="5"/>
    <rect class="hit" x="208" y="390" width="22" height="130" rx="5"/>
  </g>

  <!-- Handwortelbeentjes (pols) -->
  <g class="region" data-region="r-handwortel">
    <title>handwortelbeentjes</title>
    <rect class="hit" x="4"   y="520" width="50" height="22" rx="4"/>
    <rect class="hit" x="206" y="520" width="50" height="22" rx="4"/>
  </g>

  <!-- Middenhandsbeentjes -->
  <g class="region" data-region="r-middenhand">
    <title>middenhandsbeentjes</title>
    <rect class="hit" x="4"   y="542" width="50" height="32" rx="4"/>
    <rect class="hit" x="206" y="542" width="50" height="32" rx="4"/>
  </g>

  <!-- Vingerkootjes -->
  <g class="region" data-region="r-vingerkootjes">
    <title>vingerkootjes</title>
    <rect class="hit" x="0"   y="574" width="58" height="44" rx="6"/>
    <rect class="hit" x="202" y="574" width="58" height="44" rx="6"/>
  </g>

  <!-- Bekkengordel -->
  <g class="region" data-region="r-bekkengordel">
    <title>bekkengordel</title>
    <rect class="hit" x="68" y="440" width="130" height="92" rx="14"/>
  </g>

  <!-- Dijbeen -->
  <g class="region" data-region="r-dijbeen">
    <title>dijbeen</title>
    <rect class="hit" x="72"  y="532" width="48" height="190" rx="14"/>
    <rect class="hit" x="146" y="532" width="48" height="190" rx="14"/>
  </g>

  <!-- Kniebeen (knieschijf) -->
  <g class="region" data-region="r-kniebeen">
    <title>kniebeen</title>
    <rect class="hit" x="78"  y="722" width="42" height="32" rx="14"/>
    <rect class="hit" x="146" y="722" width="42" height="32" rx="14"/>
  </g>

  <!-- Scheenbeen (mediaal, dikker onderbeenbot) -->
  <g class="region" data-region="r-scheenbeen">
    <title>scheenbeen</title>
    <rect class="hit" x="86"  y="754" width="28" height="140" rx="6"/>
    <rect class="hit" x="152" y="754" width="28" height="140" rx="6"/>
  </g>

  <!-- Kuitbeen (lateraal, dunner onderbeenbot) -->
  <g class="region" data-region="r-kuitbeen">
    <title>kuitbeen</title>
    <rect class="hit" x="114" y="760" width="14" height="130" rx="4"/>
    <rect class="hit" x="180" y="760" width="14" height="130" rx="4"/>
  </g>

  <!-- Voetwortelbeentjes (hiel/wreef) -->
  <g class="region" data-region="r-voetwortel">
    <title>voetwortelbeentjes</title>
    <rect class="hit" x="68"  y="894" width="60" height="26" rx="6"/>
    <rect class="hit" x="138" y="894" width="60" height="26" rx="6"/>
  </g>

  <!-- Middenvoetsbeentjes -->
  <g class="region" data-region="r-middenvoet">
    <title>middenvoetsbeentjes</title>
    <rect class="hit" x="64"  y="920" width="64" height="26" rx="4"/>
    <rect class="hit" x="138" y="920" width="64" height="26" rx="4"/>
  </g>

  <!-- Teenkootjes -->
  <g class="region" data-region="r-teenkootjes">
    <title>teenkootjes</title>
    <rect class="hit" x="60"  y="946" width="70" height="34" rx="6"/>
    <rect class="hit" x="138" y="946" width="70" height="34" rx="6"/>
  </g>

  <!-- ================ ACHTERAANZICHT (rechts, offset +240px) ================ -->

  <!-- Schouderblad (alleen aan achterkant goed zichtbaar) -->
  <g class="region" data-region="r-schouderblad">
    <title>schouderblad</title>
    <rect class="hit" x="262" y="218" width="62" height="56" rx="8"/>
    <rect class="hit" x="378" y="218" width="62" height="56" rx="8"/>
  </g>

  <!-- Wervelkolom (volle ruglengte, midden van het achteraanzicht) -->
  <g class="region" data-region="r-wervelkolom">
    <title>wervelkolom</title>
    <rect class="hit" x="346" y="160" width="26" height="320" rx="6"/>
  </g>

</svg>
