<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 560" class="anat-svg" aria-label="Skelet vooraanzicht">
  <defs>
    <style>
      .body-bg { fill:#fef3f2; stroke:#fbcfe8; stroke-width:1; }
      .bone    { fill:#f8fafc; stroke:#475569; stroke-width:1.3; }
      .feature { fill:#475569; }
      .region  { cursor:pointer; }
      .region:hover .bone      { fill:#fef9c3; }
      .region.correct .bone    { fill:#bbf7d0; stroke:#16a34a; stroke-width:2; }
      .region.wrong   .bone    { fill:#fecaca; stroke:#dc2626; stroke-width:2; }
      .region.hint    .bone    { fill:#bfdbfe; stroke:#2563eb; stroke-width:2; }
    </style>
  </defs>

  <!-- Lichaamssilhouet (achtergrond) -->
  <g class="silhouette" pointer-events="none">
    <ellipse class="body-bg" cx="110" cy="50"  rx="38" ry="42"/>
    <rect    class="body-bg" x="48"  y="92"   width="124" height="160" rx="30"/>
    <rect    class="body-bg" x="18"  y="108"  width="38"  height="190" rx="18"/>
    <rect    class="body-bg" x="164" y="108"  width="38"  height="190" rx="18"/>
    <rect    class="body-bg" x="62"  y="240"  width="40"  height="315" rx="18"/>
    <rect    class="body-bg" x="118" y="240"  width="40"  height="315" rx="18"/>
  </g>

